name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_sdk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory_sdk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEMORY_SDK_TEST_POSTGRES_DSN: postgresql://memory:memory@127.0.0.1:5432/memory_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev,postgres]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install n8n node dependencies
        run: npm install --prefix n8n --no-audit --no-fund
      - name: Typecheck n8n node
        run: npm run --prefix n8n typecheck
      - name: Build n8n node
        run: npm run --prefix n8n build
      - name: Validate npm package contents
        run: cd n8n && npm pack --dry-run

  n8n-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local Python SDK and bridge
        run: pip install -e .
      - name: Build and pack community node
        run: |
          npm install --prefix n8n --no-audit --no-fund
          npm run --prefix n8n build
          mkdir -p "$RUNNER_TEMP/packages"
          (cd n8n && npm pack --pack-destination "$RUNNER_TEMP/packages")
      - name: Install packed node artifact
        run: |
          mkdir -p "$RUNNER_TEMP/n8n-user/nodes"
          cd "$RUNNER_TEMP/n8n-user/nodes"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packages/n8n-nodes-ai-memory-sdk-*.tgz
          test -f node_modules/n8n-nodes-ai-memory-sdk/dist/nodes/AiMemory/AiMemory.node.js
          test -f node_modules/n8n-nodes-ai-memory-sdk/dist/nodes/AiMemory/aiMemory.svg
      - name: Install pinned self-hosted n8n runtime
        run: |
          mkdir -p "$RUNNER_TEMP/n8n-runtime"
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/n8n-runtime" n8n@2.36.8
      - name: Start n8n and verify packed AI Memory SDK node is registered
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-user
          N8N_CUSTOM_EXTENSIONS: ${{ runner.temp }}/n8n-user/nodes
          N8N_HOST: 127.0.0.1
          N8N_PORT: '5680'
          N8N_PROTOCOL: http
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
          N8N_COMMUNITY_PACKAGES_ENABLED: 'true'
          N8N_UNVERIFIED_PACKAGES_ENABLED: 'true'
          N8N_SECURE_COOKIE: 'false'
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/n8n-runtime.log"
          CATALOG="$RUNNER_TEMP/n8n-user/.cache/n8n/public/types/nodes.json"
          "$RUNNER_TEMP/n8n-runtime/node_modules/.bin/n8n" start >"$LOG" 2>&1 &
          N8N_PID=$!
          trap 'kill "$N8N_PID" 2>/dev/null || true; cat "$LOG"' EXIT

          # A raw npm install under ~/.n8n/nodes is not equivalent to n8n's managed
          # community-package installation, which is database tracked. For CI we load
          # the exact packed artifact through n8n's supported custom-extension root
          # instead of fabricating package database rows.
          for attempt in $(seq 1 420); do
            if ! kill -0 "$N8N_PID" 2>/dev/null; then
              echo "n8n exited before the editor became ready"
              exit 1
            fi
            if grep -q "Editor is now accessible via:" "$LOG"; then
              break
            fi
            if [ "$attempt" -eq 420 ]; then
              echo "n8n editor did not become ready before timeout"
              exit 1
            fi
            sleep 1
          done

          # n8n 2.36 protects /types/nodes.json with editor authentication. The server
          # serves that route from this generated static-cache file, so inspect the same
          # runtime-generated catalog directly instead of treating an unauthenticated HTTP
          # response as a registration oracle.
          for attempt in $(seq 1 60); do
            if ! kill -0 "$N8N_PID" 2>/dev/null; then
              echo "n8n exited before the node catalog registered AI Memory SDK"
              exit 1
            fi

            if [ -s "$CATALOG" ]; then
              if python - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = Path(os.environ['RUNNER_TEMP']).joinpath('n8n-user/.cache/n8n/public/types/nodes.json')
          try:
              node_types = json.loads(catalog.read_text())
          except (json.JSONDecodeError, OSError):
              raise SystemExit(1)

          serialized = json.dumps(node_types)
          raise SystemExit(0 if 'aiMemory' in serialized and 'AI Memory SDK' in serialized else 1)
          PY
              then
                echo "AI Memory SDK packed node registered successfully"
                exit 0
              fi
            fi

            sleep 1
          done

          echo "AI Memory SDK packed node was not present in n8n's generated node catalog"
          echo "Static cache contents:"
          find "$RUNNER_TEMP/n8n-user/.cache/n8n/public" -maxdepth 3 -type f -print 2>/dev/null || true
          echo "Catalog matches for AI Memory identifiers:"
          grep -o -E '.{0,80}(aiMemory|AI Memory SDK).{0,80}' "$CATALOG" 2>/dev/null | head -20 || true
          echo "Loader-related log lines:"
          grep -i -E 'custom|node|load|error|warn' "$LOG" | tail -120 || true
          exit 1

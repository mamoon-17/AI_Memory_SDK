[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-memory-sdk"
version = "0.1.0"
description = "Local-first long-term memory engine for AI agents and n8n workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mamoon Masood" }]
dependencies = [
  "fastembed>=0.4,<1",
  "langgraph>=0.2,<1",
  "litellm>=1.40,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["sdk/memory_sdk"]

[tool.pytest.ini_options]
pythonpath = ["sdk"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
